name: Update Screenshots & Discovery

# 每天定时两件事:
#   ① 重跑 fetch-screenshots.mjs,刷新 public/data/plugins.json 的 screenshots 字段
#   ② 跑 discover-plugins.mjs,生成新插件「提名」清单 data/discovery/candidates.json
#      (提名 ≠ 收录:候选仅供人工/AI 审核,收录仍走既有数据源流程)
# 两个脚本都幂等 —— git diff 有变化才 commit 回 master(→ 触发 mirror 同步 →
# Vercel 重新部署),无变化不产生空提交。

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC = 10:17 北京时间,错开 GitHub 整点高峰
  workflow_dispatch:

concurrency:
  group: update-screenshots
  cancel-in-progress: false

permissions:
  contents: write # 允许 GITHUB_TOKEN push 回 master

jobs:
  update:
    # 只在旧仓库运行;被 mirror 同步到新仓库后自动跳过(同 ci.yml/mirror.yml)
    if: github.repository == 'the-beating-light-of-the-nail/dsh-meme-hub-site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_DIRECT: '1' # runner 直连 GitHub,不走本机 sing-box 代理
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh screenshots (fetch-screenshots.mjs)
        run: node scripts/fetch-screenshots.mjs
        # 只用 git ls-remote + raw.githubusercontent,不占 API 配额,无需 token

      - name: Discover plugin candidates (discover-plugins.mjs, nomination only)
        run: node scripts/discover-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 搜索接口带 token 30 次/分(匿名 10 次/分)

      - name: Commit & push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/plugins.json data/discovery/candidates.json
          if git diff --cached --quiet; then
            echo '截图与候选均无变化,跳过提交'
          else
            git commit -m 'chore(data): auto refresh screenshots + discovery candidates'
            git push
          fi
