name: CI Build Check

# 云端验证构建（本机内存铁律：禁止本地 build/generate/dev）。
# 不部署，只确认 nuxi generate 全量预渲染 + check-prerender 通过。
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  build:
    # 只在旧仓库运行；被 mirror 同步到新仓库后自动跳过
    if: github.repository == 'the-beating-light-of-the-nail/dsh-meme-hub-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_SITE_URL: 'https://dsh-meme-hub-site.vercel.app'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx nuxi typecheck
      - run: npx nuxi generate
      - run: node scripts/check-prerender.mjs
