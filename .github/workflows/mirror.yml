name: Mirror to Vercel repo

# 每次 push 到 master 后，把本仓库完整同步到 Vercel 部署镜像仓库
# (alexanderdcervantes-commits/dsh-hub)。需要旧仓库 secrets 里配置
# MIRROR_PAT：一个对镜像仓库有写入权限的 PAT。

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: mirror-dsh-hub
  cancel-in-progress: true

jobs:
  mirror:
    # 只在旧仓库运行；被 mirror 同步到新仓库后自动跳过
    if: github.repository == 'the-beating-light-of-the-nail/dsh-meme-hub-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to mirror repository
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "MIRROR_PAT is not set, skipping mirror"
            exit 0
          fi
          git remote add mirror "https://x-access-token:${MIRROR_PAT}@github.com/alexanderdcervantes-commits/dsh-hub.git"
          git push --force --mirror mirror
