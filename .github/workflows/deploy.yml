name: Deploy to Vercel (Prebuilt)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # 配好 VERCEL_* secrets 后，把 repo variable VERCEL_ENABLED 设为 true 才会跑
    if: ${{ vars.VERCEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 站点唯一域名出口：canonical/og:url/sitemap/robots 全部读它。
      # 过渡期指向 Vercel 子域名；绑定正式域名 dsh-meme-hub.cdqyfdbymn.me 后改这一处即可全站生效。
      NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://dsh-meme-hub-site.vercel.app' }}
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings & env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (nuxi generate, full SSG)
        run: npx nuxi generate
        env:
          NUXT_PUBLIC_SITE_URL: ${{ env.NUXT_PUBLIC_SITE_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify prerender coverage
        run: node scripts/check-prerender.mjs

      - name: Write IndexNow key into build output
        if: ${{ secrets.INDEXNOW_KEY != '' }}
        run: node scripts/indexnow-submit.mjs keyfile
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NUXT_PUBLIC_SITE_URL: ${{ env.NUXT_PUBLIC_SITE_URL }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: IndexNow submit
        if: ${{ secrets.INDEXNOW_KEY != '' }}
        run: node scripts/indexnow-submit.mjs sitemap
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NUXT_PUBLIC_SITE_URL: ${{ env.NUXT_PUBLIC_SITE_URL }}
