<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">DSH-Web Desktop startup screen</title>
  <desc id="desc">White native window with a whale, gateway startup message, and progress indicator.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#0f172a" flood-opacity=".24"/></filter>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  </defs>
  <rect width="1440" height="860" rx="32" fill="url(#canvas)"/>
  <g transform="translate(120 88)" filter="url(#shadow)">
    <rect width="1200" height="684" rx="18" fill="#fff"/>
    <rect width="1200" height="46" rx="18" fill="#f5f7fa"/>
    <rect y="28" width="1200" height="18" fill="#f5f7fa"/>
    <text x="24" y="30" fill="#334155" font-size="17" font-family="Segoe UI, Microsoft YaHei UI, sans-serif">DeepSeek Harness</text>
    <g transform="translate(600 270)" text-anchor="middle">
      <text y="0" font-size="86" font-family="Segoe UI Emoji, Apple Color Emoji">🐳</text>
      <text y="92" fill="#1e4678" font-size="42" font-weight="700" font-family="Microsoft YaHei UI, PingFang SC, sans-serif">正在拉起网关…</text>
      <text y="152" fill="#788498" font-size="23" font-family="Microsoft YaHei UI, PingFang SC, sans-serif">◐ 正在启动服务，请稍候</text>
    </g>
    <text x="600" y="654" text-anchor="middle" fill="#aab2be" font-size="18" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">DeepSeek Harness Desktop</text>
  </g>
</svg>

